<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glimpse - Host</title>
  <link rel="stylesheet" href="glimpse.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎬 Glimpse Host</h1>
    </div>

    <div class="game-area">
      <div id="room-info" class="room-info">
        <h2>Room Code: <span id="room-code"></span></h2>
        <p>Share this code with players to join</p>
      </div>

      <div id="status-display" class="status-message">
        Waiting for players to join...
      </div>

      <div class="controls">
        <button id="start-game-btn" class="btn btn-primary" disabled>Start Game</button>
        <button id="next-round-btn" class="btn btn-secondary" style="display: none;">Next Round</button>
        <button id="end-game-btn" class="btn btn-secondary" style="display: none;">End Game</button>
      </div>

      <div id="video-area" class="video-container" style="display: none;">
        <div id="video-player"></div>
      </div>

      <div id="scoreboard" class="scoreboard">
        <h2>Players</h2>
        <div id="player-list" class="player-list"></div>
      </div>

      <div id="round-results" style="display: none;">
        <h2>Round Results</h2>
        <div id="results-list"></div>
      </div>
    </div>
  </div>

  <script src="host.js"></script>
</body>
</html>
